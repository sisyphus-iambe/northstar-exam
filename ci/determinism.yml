# 北极星 v3 阶段 4 — 级 4 形态 CI 示例 (GitHub Actions)
#
# 废弃/未启用 (DEPRECATED): 仓库无 .github/ 目录, 本文件不会被任何 CI 执行.
# 它引用不存在的占位仓库 (northstar-v3/stage2|3), 不可直接使用.
# 实际可跑的确定性检查 = ci/batch_determinism.py (本地运行, 5 对逐字节一致).
# 依赖: 考官 (stage2/3) 需与工作区同级, 见 README §使用说明.
name: northstar-v3-stage4-determinism

on:
  push:
  pull_request:

jobs:
  batch-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: northstar_v3_stage4
      # 考官代码: 同仓库时并排检出 (stage2/3 子目录), 或改为子模块/独立仓库
      - uses: actions/checkout@v4
        with:
          repository: northstar-v3/stage2  # 占位: 替换为实际考官仓库
          path: northstar_v3_stage2
      - uses: actions/checkout@v4
        with:
          repository: northstar-v3/stage3  # 占位: 替换为实际考官仓库
          path: northstar_v3_stage3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install numpy scipy pyarrow
      - name: Batch determinism
        working-directory: northstar_v3_stage4
        run: python ci/batch_determinism.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: determinism-evidence
          path: |
            northstar_v3_stage4/out/batch_determinism.json
            northstar_v3_stage4/out/batch_evidence/*.json
